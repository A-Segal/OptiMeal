<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Outer circle -->
  <circle cx="80" cy="80" r="75" fill="#C8102E" stroke="#8B0000" stroke-width="3"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="80" cy="80" r="58" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Heart shape (top) — represents chesed / love -->
  <path d="M80 38
    C58 22, 22 40, 22 62
    C22 86, 80 118, 80 118
    C80 118, 138 86, 138 62
    C138 40, 102 22, 80 38Z"
    fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Heart inner highlight -->
  <path d="M80 52
    C68 40, 42 50, 42 64
    C42 78, 80 100, 80 100
    C80 100, 118 78, 118 64
    C118 50, 92 40, 80 52Z"
    fill="#C8102E" fill-opacity="0.55"/>

  <!-- Helping hands (two curved paths below the heart) -->
  <path d="M46 110
    C46 94, 34 86, 24 86
    C14 86, 10 92, 10 100
    C10 110, 20 118, 38 122"
    stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>

  <path d="M114 110
    C114 94, 126 86, 136 86
    C146 86, 150 92, 150 100
    C150 110, 140 118, 122 122"
    stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Central connecting element -->
  <circle cx="80" cy="100" r="8" fill="#FFFFFF" opacity="0.3"/>
</svg>
